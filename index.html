<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8">
        <title>shimaa | front-end developer</title>
        <style>
            body{
                font-family:'segoe ui', tahoma, geneva, verdana, sans-serif;
                background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
                color:#ffffff;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;  }
                .card{
                    background-color: rgba(255, 255, 255, 0.1);
                    backdrop-filter: blur(10px);
                    padding:40px;
                    border-radius:20px;
                    text-align:center;
                    box-shadow:0 8px 32px rgba(0, 0, 0, 0.3);
                    max-width: 450px;
                    border: 1px solid rgba(255, 255, 255, 0.2);}
                    h1{
                        margin-bottom: 10px;
                        font-size: 16px;}
                        p{
                            color: #d1e0ff;
                            font-size: 16px;
                            margin-bottom:25px;
                            line-height: 1.5;}
                            .skills{
                                display: flex;
                                justify-content: center;
                                gap:10px;
                                flex-wrap:wrap;
                                margin-bottom:25px;}
                                .badge{
                                    background-color: #00d2ff;
                                    color: #002b49;
                                    padding: 6px 14px;
                                    border-radius:50px;
                                    font-weight: bold;
                                    font-size: 14px;}
                                    button{
                                        background-color: #ff6b6b;
                                        color:white;
                                        border:none;
                                        padding: 12px 28px;
                                        font-size:16px;
                                        font-weight: bold;
                                        border-radius: 8px;
                                        cursor:pointer;
                                        transition: 0.3s;}
                                        button:hover{
                                            background-color: #ff4757;
                                            transform: scale(1.05);}
                                            </style>
                                            </head>
                                            <body>
                                               <div class="card">
                                                <h1>hi, i'm shimaa</h1>
                                                <p>front-end web developer passionate about building modern and interactive websites.
                                                
                                                </p>
                                                <div class="skills">
                                                    <span class="badge">html5</span>
                                                    <span class="badge">css3</span>
                                                    <span class="badge">javascript</span>
                                                    <span class="badge">typescript</span>
                                                    <span class="badge">react.js</span>
                                                    </div>
                                                    <button onclick="alert('thank you for visiting! let\'s build something amazing togethe')">contact me</button>
                                               </div>
                                            </body>
</html>
